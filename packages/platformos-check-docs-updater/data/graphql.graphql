"""
GraphQL query or mutation stored in the instance (app/graphql), returned by the admin_graphql_* mutations
"""
type GraphQL implements AdminSharedAttributesInterface {
  """
  GraphQL source of the query or mutation
  """
  body: String

  """
  Timestamp of when the object was created, set automatically by the system
  """
  created_at: JSONDate!

  """
  Unique identifier of the object
  """
  id: ID!

  """
  When true, the resource is managed outside of files: pos-cli deploy and sync never overwrite or delete it
  """
  manually_managed: Boolean

  """
  Free-form data attached to the resource with the metadata key of its file (or the metadata argument of an admin mutation)
  """
  metadata: HashObject

  """
  Path of the file the resource comes from, relative to the app directory, for
  example views/pages/index.liquid or
  modules/my_module/public/views/partials/header.liquid. Identifies the resource
  in deploy, sync and admin mutations
  """
  physical_file_path: String

  """
  Timestamp of when the object was last updated, set automatically by the system
  """
  updated_at: JSONDate!
}

"""
GraphQL query or mutation stored in the instance (app/graphql), run from Liquid with the graphql tag
"""
type GraphQuery implements AdminSharedAttributesInterface {
  """
  Timestamp of when the object was created, set automatically by the system
  """
  created_at: JSONDate!

  """
  Unique identifier of the object
  """
  id: ID!

  """
  When true, the resource is managed outside of files: pos-cli deploy and sync never overwrite or delete it
  """
  manually_managed: Boolean

  """
  Free-form data attached to the resource with the metadata key of its file (or the metadata argument of an admin mutation)
  """
  metadata: HashObject

  """
  Name used to run the query with the graphql tag: its file path below
  app/graphql without the extension, for example users/search; module queries
  are prefixed with modules/<module name>/
  """
  name: String!

  """
  Path of the file the resource comes from, relative to the app directory, for
  example views/pages/index.liquid or
  modules/my_module/public/views/partials/header.liquid. Identifies the resource
  in deploy, sync and admin mutations
  """
  physical_file_path: String

  """
  GraphQL source of the query or mutation
  """
  query_string: String!

  """
  Timestamp of when the object was last updated, set automatically by the system
  """
  updated_at: JSONDate!
}

"""
Paginated list of GraphQL queries and mutations stored in the instance
"""
type GraphQueryCollection {
  """
  Number of the page returned in results
  """
  current_page: Int!

  """
  True when there is at least one page after the current one
  """
  has_next_page: Boolean!

  """
  True when the current page is not the first one
  """
  has_previous_page: Boolean!

  """
  Maximum number of results returned on a single page
  """
  per_page: Int!

  """
  Results on the current page
  """
  results: [GraphQuery!]

  """
  Total number of results matching the query, across all pages
  """
  total_entries: Int!

  """
  Total number of pages, given per_page
  """
  total_pages: Int!
}

"""
Conditions for admin_graphql
"""
input GraphqlFilterInput {
  """
  Conditions on the creation time
  """
  created_at: DateFilter

  """
  Conditions on the id
  """
  id: UniqIdFilter

  """
  Conditions on the metadata defined in the file. All conditions are combined with AND
  """
  metadata: [JsonbFilter!]

  """
  Conditions on the name
  """
  name: StringFilter

  """
  Alternative condition sets: matches when at least one of them matches. Combined with AND with the other conditions
  """
  or: [GraphqlFilterInput!]

  """
  Conditions on the source file path relative to the app directory, e.g. views/pages/index.liquid
  """
  physical_file_path: StringFilter

  """
  Conditions on the source of the query
  """
  query_string: StringFilter

  """
  Conditions on the last update time
  """
  updated_at: DateFilter
}

"""
Attributes of a stored GraphQL query or mutation, the same ones as a graphql/*.graphql file
"""
input GraphqlInputType {
  """
  GraphQL document of the query or mutation; it must be valid against the schema
  """
  body: String!

  """
  When true, pos-cli deploy and sync never overwrite or delete it and pos-cli
  pull skips it. When omitted, defaults to the track_manually_managed setting of
  the instance (false unless enabled in app/config.yml)
  """
  manually_managed: Boolean

  """
  Arbitrary JSON data stored with the query
  """
  metadata: HashObject

  """
  Path of the file the query is stored as, used by pos-cli pull and deploy. Must
  be under `graphql/` (or legacy `graph_queries/`), optionally prefixed with
  `modules/<module_name>/public/` or `modules/<module_name>/private/`, for
  example `graphql/users/search.graphql`. The query name used by the graphql tag
  is derived from it, for example `users/search`
  """
  physical_file_path: String!
}

"""
Sort order for admin_graphql
"""
input GraphqlSortInput {
  """
  Sort by creation time
  """
  created_at: StandardSort

  """
  Sort by id
  """
  id: StandardSort

  """
  Sort by metadata values, applied in the given order
  """
  metadata: [JsonbSort!]

  """
  Sort by name
  """
  name: StandardSort

  """
  Sort by the path of the source file
  """
  physical_file_path: StandardSort

  """
  Sort by last update time
  """
  updated_at: StandardSort
}

"""
Details of the current HTTP request. Deprecated, use context.params, context.headers etc. in Liquid
