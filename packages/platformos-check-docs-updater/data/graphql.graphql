"""
Options controlling how the HTTP request of api_call_send is made
"""
input ApiCallSendOptions {
  """
  If true, the request does not go out to the internet: it is sent directly to
  the platformOS stack this instance runs on, addressed by the host of the URL.
  Use it to call this or another instance on the same stack; a host that is not
  served by this stack returns 404. Internal requests are not added to the sent
  notifications log
  """
  internal: Boolean

  """
  If true, the server certificate of an HTTPS URL is not verified (e.g. for self-signed certificates). Defaults to false
  """
  skip_ssl_verification: Boolean

  """
  Read timeout of the HTTP request in seconds, from 1 to 180. When omitted, a
  default timeout applies; requests sent during a web request are capped at a
  shorter timeout than requests sent from a background job
  """
  timeout: Int
}

"""
Autogenerated return type of ApiCallSend.
"""
type ApiCallSendPayload {
  """
  Always empty; errors are raised as GraphQL errors
  """
  errors: [BaseError!]! @deprecated(reason: "Not needed")

  """
  Response of the called server
  """
  response: Response
}

"""
HTTP request sent by api_call_send. The url, method and headers are rendered as
Liquid with data; body and form_data are sent as given.
"""
input ApiCallSendRequestInput {
  """
  Request body, delivered verbatim - it is not parsed as a Liquid template and
  may contain binary data (e.g. an encrypted Web Push payload built with the
  base64_decode filter). Cannot be combined with form_data
  """
  body: String

  """
  Sends a multipart/form-data body built from these parts, in the given order -
  use instead of body. Works with POST, PUT and PATCH; the Content-Type header
  (with its boundary) is set automatically. 1 to 100 parts
  """
  form_data: [ApiCallFormDataPartInput!]

  """
  Request headers as a hash of header name to value
  """
  headers: HashObject

  """
  HTTP method, e.g. GET, POST, PUT, PATCH or DELETE
  """
  method: String!

  """
  URL the request is sent to
  """
  url: String!
}

