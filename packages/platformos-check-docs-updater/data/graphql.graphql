type Document implements BasicPropertyInterface {
  """
  Unique identifier of the object
  """
  id: ID

  """
  All properties of the object as an object keyed by property name
  """
  properties(
    """
    Properties to return, each converted to the given type (as by the matching
    property_* field; other types become strings); all properties as stored when omitted
    """
    select: [PropertiesFieldInput!]
  ): HashObject

  """
  Returns the value of the property with the given name as a string; ex: hair_color: property(name: "hair_color")
  """
  property(
    """
    Name of the property
    """
    name: String!
  ): String

  """
  Returns the value of the property with the given name as an array of strings;
  a single value is wrapped in an array and no value gives an empty array; ex:
  todo_list: property_array(name: "todo_list")
  """
  property_array(
    """
    Name of the property
    """
    name: String!
  ): [String!]

  """
  Returns the value of the property with the given name as a boolean. Accepts
  true/false values and the strings "t"/"T" and "f"/"F"; any other value returns
  an error; ex: enabled: property_boolean(name: "enabled")
  """
  property_boolean(
    """
    Name of the property
    """
    name: String!
  ): Boolean

  """
  Returns the value of the property with the given name as a float; returns an
  error when the value is not a number; ex: price: property_float(name: "price")
  """
  property_float(
    """
    Name of the property
    """
    name: String!
  ): Float

  """
  Returns the value of the property with the given name as an integer; returns
  an error when the value cannot be converted, e.g. "abc" or "1.5"; ex: age:
  property_int(name: "age")
  """
  property_int(
    """
    Name of the property
    """
    name: String!
  ): Int

  """
  Returns the value of the property with the given name as stored, without conversion
  """
  property_json(
    """
    Name of the property
    """
    name: String!
  ): JSONPayload

  """
  Returns the value of the property with the given name parsed from JSON text
  into an object; returns an error when the value is not valid JSON
  """
  property_object(
    """
    Name of the property
    """
    name: String!
  ): HashObject
}

