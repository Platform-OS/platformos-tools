    """
    Name of the model schema (table) of the related models
    """
    model_schema_name: String
  ): ListingsCustomization

  """
  Returns models whose foreign_property equals the value of join_on_property of
  this object (has-many relation), at most 10000 at once. Legacy relation, use
  related_records of Record instead
  """
  related_models(
    """
    Name of the property of the related object that must equal the value of join_on_property
    """
    foreign_property: String!

    """
    Name of the property of this object whose value is matched against foreign_property
    """
    join_on_property: String!

    """
    Name of the model schema (table) of the related models
    """
    model_schema_name: [String]
  ): [ListingsCustomization!]

  """
  Returns the user whose foreign_property equals the value of join_on_property
  of this object; by default the user whose id is in user_id
  """
  related_user(
    """
    Name of the user attribute that must equal the value of join_on_property
    """
    foreign_property: String = "id"

    """
    Name of the property of this object holding the user id
    """
    join_on_property: String = "user_id"
  ): User

  """
  Returns the related user. Deprecated, use related_user
  """
  user(
    """
    Name of the user attribute that must equal the value of join_on_property
    """
    foreign_property: String = "id"

    """
    Name of the property of this object holding the user id
    """
    join_on_property: String = "user_id"
  ): User @deprecated(reason: "use `related_users`")
}

"""
Deprecated relation to an object loaded over HTTP from a remote endpoint
"""
interface RemoteModelInterface {
