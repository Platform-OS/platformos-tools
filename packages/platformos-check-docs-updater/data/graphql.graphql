"""
Object that can load related records
"""
interface HasRecordsInterface {
  """
  Returns one record of the given table whose foreign_property equals the value
  of join_on_property of this object (belongs-to or has-one relation). When
  several records match, the last one in sort order is returned, by default the
  most recently updated; ex: parent: related_record(table: "parent",
  join_on_property: "parent_id") { id }
  """
  related_record(
    """
    Additional conditions the related record must match
    """
    filter: RecordsFilterInput

    """
    Name of the property (or attribute, e.g. id) of the related object that must equal the value of join_on_property
    """
    foreign_property: String = "id"

    """
    Name of the property (or attribute, e.g. id or user_id) of this object whose
    value is matched against foreign_property. When the value is an array,
    records matching any of its elements are returned. Returns an error when
    this object has no such property
    """
    join_on_property: String!

    """
    Sort order used to pick the record; updated_at ascending when omitted
    """
    sort: [RecordsSortInput!]

    """
    Name of the table (or tables) the related record belongs to
    """
    table: [String]!
  ): Record

  """
  Returns records of the given table whose foreign_property equals the value of
  join_on_property of this object (has-many relation). Related records of all
  objects in the result are loaded in one batch of at most 10,000 records,
  soft-deleted records are skipped; ex: children: related_records(table:
  "child", join_on_property: "id", foreign_property: "parent_id") { id }
  """
  related_records(
    """
    Additional conditions the related records must match
    """
    filter: RecordsFilterInput

    """
    Name of the property (or attribute, e.g. id) of the related object that must equal the value of join_on_property
    """
    foreign_property: String!

    """
    Name of the property (or attribute, e.g. id or user_id) of this object whose
    value is matched against foreign_property. When the value is an array,
    records matching any of its elements are returned. Returns an error when
    this object has no such property
    """
    join_on_property: String!

    """
    Maximum number of related objects returned for each object
    """
    limit: Int

    """
    Sort order of the related records; updated_at ascending when omitted
    """
    sort: [RecordsSortInput!]

    """
    Name of the table (or tables) the related records belong to
    """
    table: [String]!
  ): [Record!]
}

"""
Object that can load related users
"""
interface HasUsersInterface {
  """
  Returns the user whose foreign_property equals the value of join_on_property
  of this object (belongs-to relation); by default the user whose id is in
  user_id; ex: invited_by: related_user(join_on_property: "invited_by_id") { id }
  """
  related_user(
    """
    Additional conditions the related user must match
    """
    filter: UsersFilterInput

    """
    Name of the property (or attribute, e.g. id, email, slug or external_id) of
    the user that must equal the value of join_on_property
    """
    foreign_property: String = "id"

    """
    Name of the property (or attribute) of this object whose value is matched
    against foreign_property. Must not be an array (use related_users). Returns
    an error when this object has no such property
    """
    join_on_property: String = "user_id"

    """
    Sort order used to pick the user when several match; the last one is returned
    """
    sort: [UsersSortInput!]
  ): User

  """
  Returns users whose foreign_property equals the value of join_on_property of
  this object (has-many relation). Related users of all objects in the result
  are loaded in one batch of at most 10,000 users, soft-deleted users are
  skipped; ex: members: related_users(join_on_property: "id", foreign_property:
  "company_id") { id }
  """
  related_users(
    """
    Additional conditions the related users must match
    """
    filter: UsersFilterInput

    """
    Name of the property (or attribute, e.g. id, email, slug or external_id) of
    the user that must equal the value of join_on_property
    """
    foreign_property: String!

    """
    Name of the property (or attribute, e.g. id) of this object whose value is
    matched against foreign_property. When the value is an array, users matching
    any of its elements are returned. Returns an error when this object has no such property
    """
    join_on_property: String!

    """
    Maximum number of related objects returned for each object
    """
    limit: Int

    """
    Sort order of the results. When several entries are given, they are applied in the given order
    """
    sort: [UsersSortInput!]
  ): [User!]
}

"""
Object made of keys and values, nested to any depth (also known as a map,
dictionary or hash). Accepts an object or a string with JSON text of an object;
anything else returns an error. In Liquid you can build one from a JSON literal,
e.g. {% assign object = { "color": "green" } %}
"""
scalar HashObject

"""
Represents data defined by platformOS stored in context.headers variable.
"""
scalar HeadersObject

"""
An ISO 8601-encoded datetime
"""
scalar ISO8601DateTime @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
Bounds for an identifier. All bounds given must match, so gt and lt together select the ids between them
"""
input IdRangeFilter {
  """
  Matches identifiers greater than the given value
  """
  gt: ID

  """
  Matches identifiers greater than or equal to the given value
  """
  gte: ID

  """
  Matches identifiers lower than the given value
  """
  lt: ID

  """
  Matches identifiers lower than or equal to the given value
  """
  lte: ID
}

