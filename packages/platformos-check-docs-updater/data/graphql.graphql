"""
Output settings of a generated image version
"""
input VersionOutputInput {
  """
  Output format of the version
  """
  format: ImageFormat

  """
  Compression quality from 0 (lowest) to 100 (highest). Defaults: PNG 80, WEBP 80, JPEG 85
  """
  quality: ImageQuality
}

"""
Resizing of a generated image version
"""
input VersionResizeInput {
  """
  Background color used with fit contain. Default: #000000
  """
  background: CssColor

  """
  How the image is fitted into width and height
  """
  fit: ImageResizeFit = cover

  """
  Target height in pixels. When omitted, it is derived from width and the aspect ratio
  """
  height: Int

  """
  Position to use when fit is cover or contain
  """
  position: ImageResizePosition

  """
  Target width in pixels. When omitted, it is derived from height and the aspect ratio
  """
  width: Int

  """
  Do not enlarge the image when its width or height is already smaller than the given dimensions
  """
  without_enlargement: Boolean = false
}

"""
Sort order for admin_versions
"""
input VersionSortInput {
  """
  Sort by the time of the change
  """
  created_at: StandardSort

  """
  Sort by kind of change
  """
  event: StandardSort

  """
  Sort by id
  """
  id: StandardSort

  """
  Sort by the id of the changed object
  """
  item_id: StandardSort

  """
  Sort by the type of the changed object
  """
  item_type: StandardSort

  """
  Sort by last update time
  """
  updated_at: StandardSort

  """
  Sort by who made the change
  """
  whodunnit: StandardSort
}
