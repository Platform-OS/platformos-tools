  example views/pages/index.liquid or
  modules/my_module/public/views/partials/header.liquid. Identifies the resource
  in deploy, sync and admin mutations
  """
  physical_file_path: String

  """
  Timestamp of when the object was last updated, set automatically by the system
  """
  updated_at: JSONDate!
}

"""
A single aggregation computed over the documents matching the query
"""
input AggregationField {
  """
  Sub-aggregations computed separately for every bucket of this aggregation. Only used together with field_name
  """
  aggregations: [AggregationField]

  """
  Legacy: not used
  """
  customization_name: String

  """
  Legacy: property of customizations attached to user profiles of profile_type
  to aggregate on, for the deprecated people query
  """
  customization_property_name: String

  """
  Field to aggregate on, e.g. `properties.color` or `created_at`. For a
  `properties.` field the exact (not analyzed) value is used
  """
  field_name: String

  """
  Key under which the result of this aggregation is returned
  """
  name: String!

  """
  Legacy: user profile property to aggregate on instead of field_name, for the deprecated people query
  """
  profile_property_name: String

  """
  Legacy: user profile type that profile_property_name and
  customization_property_name aggregations are restricted to; required with
  customization_property_name
  """
  profile_type: String

  """
  Maximum number of buckets returned by a terms aggregation
  """
  size: Int = 200

  """
  Order of the buckets of a terms aggregation. When omitted, field_name
  aggregations are ordered by document count descending, and
  profile_property_name / customization_property_name aggregations by value ascending
  """
  sort: AggregationSort

  """
  Kind of aggregation computed for field_name. profile_property_name and
  customization_property_name aggregations are always terms aggregations
  """
  type: AggregationTypeEnum = terms
}

"""
Order of the buckets returned by a terms aggregation
"""
input AggregationSort {
  """
  What to order the buckets by
  """
  name: AggregationSortFieldEnum = _term

  """
  Direction of the ordering
  """
  order: AggregationSortOrderEnum = asc
}

"""
What the buckets of a terms aggregation are ordered by
"""
enum AggregationSortFieldEnum {
  """
  Order buckets by the number of documents they contain
  """
  _count

  """
  Order buckets by their value
  """
  _term
}

"""
Direction in which aggregation buckets are ordered
"""
enum AggregationSortOrderEnum {
  """
  Ascending
  """
  asc

  """
  Descending
  """
  desc
}

"""
Kind of aggregation computed for a field
"""
enum AggregationTypeEnum {
  """
  Returns the average value of the field among the matching documents
  """
  avg

  """
  Returns the maximum value of the field among the matching documents
  """
  max

  """
  Returns the minimum value of the field among the matching documents
  """
  min

  """
  Groups the matching documents into one bucket per unique value of the field and counts the documents in each bucket
  """
  terms
}

"""
Results of the aggregations requested by the aggregations argument
"""
type Aggregations {
  """
  Currently identical to raw
  """
  compact: JSONPayload

  """
  Aggregation results as returned by the search index, keyed by the names given in the aggregations argument
  """
  raw: JSONPayload
}

"""
Value of any type: string, number, boolean, object or array. A string input is
used as is; any other input is converted to its JSON text (e.g. 5 becomes "5",
true becomes "true"). Output is returned unchanged
"""
scalar Any

"""
A file sent as a multipart/form-data part. Provide exactly one of url or
content_base64. All files and values of one request share a 50MB limit.
"""
input ApiCallFormDataFileInput {
  """
  Base64-encoded file content, for files generated in Liquid (e.g. with the base64_encode filter)
  """
  content_base64: String

  """
  Content-Type of the file. Defaults to application/octet-stream
  """
  content_type: String

  """
  The filename sent in the Content-Disposition header. Defaults to the last segment of url, or "file"
  """
  filename: String

  """
  URL the file is downloaded from before the request is sent (at most 10 per request), e.g. the url of an uploaded property
  """
  url: String
}

"""
One part of a multipart/form-data request body. Provide exactly one of value or file.
"""
input ApiCallFormDataPartInput {
  """
  Content-Type of a value part (e.g. application/json), omitted when not provided. For a file use file.content_type
  """
  content_type: String

  """
  A file field
  """
  file: ApiCallFormDataFileInput

  """
  The form field name. Names may repeat (e.g. "files[]")
  """
  name: String!

  """
  A text field value, sent verbatim
  """
  value: String
}

"""
API call template (app/api_calls): an HTTP request to an external endpoint, sent with the api_call_send mutation
"""
type ApiCallNotification implements AdminSharedAttributesInterface {
  """
  Liquid run after the response is received, with access to it as the response
  variable (response.code, response.body, response.headers)
  """
  callback: String

  """
  Liquid that evaluates to the request body, for example a JSON document
  """
  content: String

  """
  Timestamp of when the object was created, set automatically by the system
  """
  created_at: JSONDate!

  """
  Number of minutes to wait before sending the request. Ignored by
  api_call_send, which always sends the request immediately. Defaults to 0
  """
  delay_by: String

  """
  Deprecated, legacy forms that send this API call
  """
  form_configurations: [FormConfiguration!] @deprecated(reason: "use forms")

  """
  Deprecated, legacy forms that send this API call
  """
  forms: [Form!]

  """
  Liquid that evaluates to a JSON object of request headers
  """
  headers: String

  """
  Unique identifier of the object
  """
  id: ID!

  """
  When true, the resource is managed outside of files: pos-cli deploy and sync never overwrite or delete it
  """
  manually_managed: Boolean

  """
  Free-form data attached to the resource with the metadata key of its file (or the metadata argument of an admin mutation)
  """
  metadata: HashObject

  """
  Name of the API call, used to send it with the api_call_send mutation
  """
  name: String!

  """
  Path of the file the resource comes from, relative to the app directory, for
  example views/pages/index.liquid or
  modules/my_module/public/views/partials/header.liquid. Identifies the resource
  in deploy, sync and admin mutations
  """
  physical_file_path: String

  """
  Liquid that evaluates to the HTTP method of the request: Get, Post, Put,
  Patch, Delete, Head, or to send files as multipart/form-data: Post_Multipart,
  Put_Multipart, Patch_Multipart
  """
  request_type: String!

  """
  Liquid that evaluates to the URL the request is sent to
  """
  to: String!

  """
  Liquid that evaluates to true (or t) when the request should be sent; any other result skips it. Defaults to true
  """
  trigger_condition: String

  """
  Timestamp of when the object was last updated, set automatically by the system
  """
  updated_at: JSONDate!
}

