"""
Conditions on a date/time field. All operators given in one filter must match
(they are combined with AND); operators with a null or empty value are ignored.
Values are strings in any common date/time format, ISO 8601 recommended (e.g.
"2024-05-01", "2024-05-01T13:30:00Z"); times without a UTC offset are read as
UTC. gt, gte, lt and lte also accept a Unix timestamp in seconds (e.g.
"1714570200"). When gt, gte, lt or lte is given a date without a time, it covers
the whole day in UTC: gte "2024-05-01" includes all of 1 May, gt "2024-05-01"
starts on 2 May
"""
input DateFilter {
  """
  true matches when the field has a value, false matches when it is empty (null)
  """
  exists: Boolean

  """
  Matches when the field is later than the given time. A date without a time means after that day
  """
  gt: String

  """
  Matches when the field is later than or equal to the given time. A date without a time includes the whole day
  """
  gte: String

  """
  Matches when the field is earlier than the given time. A date without a time means before that day
  """
  lt: String

  """
  Matches when the field is earlier than or equal to the given time. A date without a time includes the whole day
  """
  lte: String

  """
  Matches when the field is not equal to the given point in time
  """
  not_value: String

  """
  Matches when the field equals none of the given points in time
  """
  not_value_in: [String!]

  """
  Matches when the field equals exactly the given point in time. A date without
  a time means midnight UTC; use gte and lte to match a whole day
  """
  value: String

  """
  Matches when the field equals exactly one of the given points in time
  """
  value_in: [String!]
}

